name: Anime-only release

on:
  push:
    tags:
      - 'v*'
    # Some repositories don't fire tag pushes or allow manual dispatch; a release
    # branch is a reliable alternative that still produces the same tag.
    branches:
      - 'release/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Build release APKs
    runs-on: 'ubuntu-24.04'

    steps:
      - name: Clone repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: 17
          distribution: temurin

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b # v4.3.0

      - name: Prepare the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PREVIEW_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PREVIEW_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PREVIEW_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PREVIEW_KEY_PASSWORD }}
        run: |
          set -e
          echo "$KEYSTORE_BASE64" | base64 -d > preview.keystore
          echo "ANIKKU_KEYSTORE_PATH=$GITHUB_WORKSPACE/preview.keystore" >> "$GITHUB_ENV"
          echo "ANIKKU_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANIKKU_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANIKKU_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build the APKs
        run: ./gradlew assembleEs -Penable-updater

      - name: Check the signing certificate
        run: |
          set -e
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          echo "== certificate of this build =="
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/es/app-arm64-v8a-es.apk \
            | grep -i "SHA-256 digest"
          echo "== certificate of the previous release =="
          previous_tag="v0.19.2"
          curl -sL -o previous.apk \
            "https://github.com/ruuuberth/aniyomi/releases/download/$previous_tag/aniyomi-anime-only-$previous_tag-arm64-v8a.apk"
          "$APKSIGNER" verify --print-certs previous.apk | grep -i "SHA-256 digest"
          rm -f previous.apk

      - name: Rename APKs
        if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/')
        run: |
          set -e
          cd app/build/outputs/apk/es
          tag="${GITHUB_REF#refs/tags/}"
          if [[ "$GITHUB_REF" == refs/heads/release/* ]]; then tag="${GITHUB_REF##*/}"; fi
          mv app-universal-es.apk "aniyomi-es-$tag-universal.apk"
          mv app-arm64-v8a-es.apk "aniyomi-es-$tag-arm64-v8a.apk"
          mv app-armeabi-v7a-es.apk "aniyomi-es-$tag-armeabi-v7a.apk"
          mv app-x86-es.apk "aniyomi-es-$tag-x86.apk"
          mv app-x86_64-es.apk "aniyomi-es-$tag-x86_64.apk"
          sha256sum *.apk > checksums.txt
          cat checksums.txt

      - name: Write release notes
        if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/')
        run: |
          set -e
          tag="${GITHUB_REF#refs/tags/}"
          if [[ "$GITHUB_REF" == refs/heads/release/* ]]; then tag="${GITHUB_REF##*/}"; fi
          {
            echo "Aniyomi [ES] is the Spanish anime-only build of Aniyomi: all manga"
            echo "functionality has been removed."
            echo
            echo "These APKs are signed with the project's key, so the app id is"
            echo "\`com.ruuuberth.aniyomi.es\` and it installs side by side with the"
            echo "regular Aniyomi app."
            echo
            echo "### Changelog"
            echo
            awk -v tag="$tag" '
              $0 ~ "^## \\[" tag "\\]" { found=1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md
            echo
            echo "### Checksums"
            echo
            echo "See \`checksums.txt\` (SHA-256 of every APK)."
          } > release-notes.md
          cat release-notes.md

      - name: Upload APK artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-apks-${{ github.sha }}
          path: app/build/outputs/apk/es/*.apk

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/')
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ github.ref_name }}
          name: Aniyomi [ES] ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            app/build/outputs/apk/es/*.apk
            app/build/outputs/apk/es/checksums.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
