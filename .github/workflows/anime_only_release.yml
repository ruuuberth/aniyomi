name: Anime-only release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Build release APKs
    runs-on: 'ubuntu-24.04'

    steps:
      - name: Clone repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: 17
          distribution: temurin

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b # v4.3.0

      - name: Build preview APKs
        run: ./gradlew assemblePreview -Penable-updater

      - name: Rename APKs
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -e
          cd app/build/outputs/apk/preview
          tag="${GITHUB_REF#refs/tags/}"
          mv app-universal-preview.apk "aniyomi-anime-only-$tag-universal.apk"
          mv app-arm64-v8a-preview.apk "aniyomi-anime-only-$tag-arm64-v8a.apk"
          mv app-armeabi-v7a-preview.apk "aniyomi-anime-only-$tag-armeabi-v7a.apk"
          mv app-x86-preview.apk "aniyomi-anime-only-$tag-x86.apk"
          mv app-x86_64-preview.apk "aniyomi-anime-only-$tag-x86_64.apk"
          sha256sum *.apk > checksums.txt
          cat checksums.txt

      - name: Upload APK artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-apks-${{ github.sha }}
          path: app/build/outputs/apk/preview/*.apk

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ github.ref_name }}
          name: Aniyomi Anime-Only ${{ github.ref_name }}
          body: |
            Anime-only build of Aniyomi: all manga functionality has been removed.

            These APKs are signed with the debug key, so the app id is
            `xyz.jmir.tachiyomi.mi.debug` and it installs side by side with the
            regular Aniyomi app.

            ### Checksums

            See `checksums.txt` (SHA-256 of every APK).
          files: |
            app/build/outputs/apk/preview/*.apk
            app/build/outputs/apk/preview/checksums.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
